---

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 2.x
  pull_request: null

name: Postgres

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testo:
    name: Postgres PHP ${{ matrix.php-versions }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['lowest', 'highest']
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          extensions: mbstring, pdo, pdo_pgsql

      - name: 🤖 Validate composer.json and composer.lock
        run: composer validate --ansi --strict

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: 🛠️ Start Postgres
        run: composer db:up -- postgres

      - name: 🚀 Execute Tests
        env:
          DB_REQUIRED: 1
        run: composer test:postgres

...
