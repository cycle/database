---

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 2.x
  pull_request: null

name: MSSQL

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testo:
    name: SQLServer PHP ${{ matrix.php-versions }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['lowest', 'highest']
    steps:
      - name: Install ODBC driver.
        run: |
          sudo curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: 📦 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: pecl
          extensions: mbstring, pdo, pdo_sqlsrv

      - name: 🤖 Validate composer.json and composer.lock
        run: composer validate --ansi --strict

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: 🛠️ Start SQL Server
        run: composer db:up -- sqlserver

      - name: 🚀 Execute Tests
        env:
          DB_REQUIRED: 1
        run: composer test:sqlserver

...
